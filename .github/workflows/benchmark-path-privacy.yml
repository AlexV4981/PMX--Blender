name: Benchmark portable sandbox path tests
on:
  pull_request:
    branches: [Multi-Model-PMX-Benchmark]
permissions:
  contents: read
jobs:
  path-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s multi-model-benchmark/tests -p test_local_sandbox.py -v
