name: Qwen local helper review validation
on:
  push:
    branches: [Qwen-Local-Helper]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  test-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow
      - name: Existing pipeline tests
        run: python -m unittest discover -s skills/anime-blender-pipeline/scripts/tests -v
      - name: Helper tests
        run: python -m unittest discover -s qwen-helper/tests -v
      - name: Seed validation
        run: python skills/anime-blender-pipeline/scripts/blender_tools.py validate-seeds
      - name: Compute Qwen correction rate
        id: review
        if: always()
        run: python qwen-helper/review.py --github-output "$GITHUB_OUTPUT"
      - name: Open or refresh alert issue
        if: steps.review.outputs.alert == 'true'
        uses: actions/github-script@v7
        env:
          RATE: ${{ steps.review.outputs.rate }}
          TOTAL: ${{ steps.review.outputs.total }}
          FAILED: ${{ steps.review.outputs.failed }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = 'Qwen helper: correction rate exceeded 10%';
            const body = `Qwen-Local-Helper exceeded the 10% correction/rejection threshold.\n\nRate: ${process.env.RATE}; reviewed: ${process.env.TOTAL}; repaired/rejected: ${process.env.FAILED}.\n\nStop assigning Qwen tasks and inspect qwen-helper/reviews.jsonl. Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'open',per_page:100});
            const found = issues.find(issue => issue.title === title);
            if (found) await github.rest.issues.update({owner,repo,issue_number:found.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
      - name: Fail when greater than 10%
        if: steps.review.outputs.alert == 'true'
        run: exit 1
