name: Stage archive qualification
on:
  push:
    branches: [review/pipeline-v4-bounded, experiment/v4.3-knowledge-driven]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s skills/anime-blender-pipeline/scripts/tests -p test_stage_archive.py -v
