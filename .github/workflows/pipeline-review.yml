name: Pipeline utility qualification
on:
  pull_request:
    branches: [Pipeline-Optimization]
  push:
    branches: [review/pipeline-v4-bounded]
permissions:
  contents: read
jobs:
  utility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: python -m unittest discover -s skills/sprawling-instructor/tests -v
      - run: python -m unittest discover -s skills/anime-blender-pipeline/scripts/tests -v
      - name: Confirm identical storage utilities
        run: cmp skills/sprawling-instructor/scripts/artifact_dedup.py skills/anime-blender-pipeline/scripts/artifact_dedup.py
